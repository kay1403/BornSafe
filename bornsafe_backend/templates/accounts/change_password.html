{% extends "base/base.html" %}

{% block title %}Changer mon mot de passe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-lg shadow-lg p-8 border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Changer mon mot de passe</h1>
        
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="form-label">Ancien mot de passe</label>
                    <input type="password" name="old_password" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Nouveau mot de passe</label>
                    <input type="password" name="new_password" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Confirmer</label>
                    <input type="password" name="confirm_password" class="form-input" required>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end space-x-3">
                <a href="{% url 'profile' %}" class="btn-secondary">Annuler</a>
                <button type="submit" class="btn-primary">Changer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
