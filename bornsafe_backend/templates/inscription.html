{% extends "base/base.html" %}

{% block title %}Inscription - BornSafe Mairie{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-lg shadow-lg p-8 border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Créer un compte</h1>
        
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" required class="form-input">
            </div>
            
            <div>
                <label class="form-label">Email</label>
                <input type="email" name="email" required class="form-input">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="form-label">Prénom</label>
                    <input type="text" name="first_name" required class="form-input">
                </div>
                <div>
                    <label class="form-label">Nom</label>
                    <input type="text" name="last_name" required class="form-input">
                </div>
            </div>
            
            <div>
                <label class="form-label">Téléphone</label>
                <input type="tel" name="phone_number" required class="form-input">
            </div>
            
            <div>
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password1" required class="form-input">
            </div>
            
            <div>
                <label class="form-label">Confirmer le mot de passe</label>
                <input type="password" name="password2" required class="form-input">
            </div>
            
            <button type="submit" class="w-full btn-primary">S'inscrire</button>
        </form>
        
        <p class="text-center text-sm text-gray-600 mt-4">
            Déjà inscrit ? <a href="{% url 'login' %}" class="text-gabon-flag-green">Connectez-vous</a>
        </p>
    </div>
</div>
{% endblock %}
